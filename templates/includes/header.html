 {% load static %}
<header class="p-3">
    <div class="container">
      <div class="d-flex flex-wrap align-items-center justify-content-center">
        <a href="{% url "homepage" %}" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
          <img src="{% static "images/logo.png" %}" width="50px">
        </a>

        <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
            <li><a href="{% url 'homepage' %}" class="nav-link">Главная</a></li>
            <li><a href="{% url 'about' %}" class="nav-link">О нас</a></li>
            <li><a href="{% url 'contact' %}" class="nav-link">Контакты</a></li>
            {% for category in categories%}  
                <li>
                    <a href="{% url 'category_news' category.id %}" class="nav-link px-2">
                    {{category.title}}
                    </a>
                </li>
            {% endfor %} 
        </ul>

        <form action='{% url "search_news" %}' method='GET' class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search">
          <input name='q' type="search" class="form-control" placeholder="Поиск...">
        </form>

        <div class="text-end">
          <button type="button" class="btn btn-outline-info">Вход</button>
          <button type="button" class="btn btn-outline-info">Регистрация</button>
        </div>
      </div>
    </div>
  </header>
