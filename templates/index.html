{% extends "base.html" %}
{% block content %}

    <!-- content  -->
     <div class="container">

      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        {% for arti in articles %}
        <div class="col">
          <div class="card shadow-sm">
            <img src="{{arti.image.url}}" width="100%" height='300px'>
            <div class="card-body">
              <p class="card-text">{{arti.title|truncatewords:4}}</p>
              <div class="d-flex justify-content-between align-items-center">
                <small class="text-body-secondary">{{arti.date}}</small>
                <small class="text-danger">{{arti.category}}</small>
              </div>
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
    <!-- content end -->

  {% endblock content %}
